<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select what to encrypt — Data Encrypter</title>
    <link rel="stylesheet" href="select.css">
</head>
<body>
    <main class="dialog-card">
        <div class="brand-mark" aria-hidden="true">DE</div>
        <p class="eyebrow">PROTECT YOUR DATA</p>
        <h1>What would you like to encrypt?</h1>
        <p class="description">Choose a file or a folder to create your protected archive.</p>

        <div class="choices" role="group" aria-label="Choose file or folder">
            <button id="fileButton" class="choice-button" type="button">
                <span class="choice-icon" aria-hidden="true">▤</span>
                <span class="choice-copy"><strong>A file</strong><small>Encrypt one document or item</small></span>
                <span class="choice-arrow" aria-hidden="true">›</span>
            </button>
            <button id="folderButton" class="choice-button" type="button">
                <span class="choice-icon folder-icon" aria-hidden="true">▰</span>
                <span class="choice-copy"><strong>A folder</strong><small>Encrypt a folder and its contents</small></span>
                <span class="choice-arrow" aria-hidden="true">›</span>
            </button>
        </div>

        <button id="cancelButton" class="cancel-button" type="button">Cancel</button>
    </main>
    <script src="select.js"></script>
</body>
</html>
